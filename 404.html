<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GasTrack — Open in the app</title>
  <meta name="description" content="This link opens in the GasTrack app." />
  <meta name="robots" content="noindex" />
  <meta name="author" content="Terry Boakye Yiadom" />
  <meta name="copyright" content="© 2025–2026 GasTrack. All rights reserved." />
  <!-- Favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <!-- PWA / social sharing -->
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0A0A0F">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;family=DM+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<!--
  GitHub Pages serves this file for every unmatched path.

  It exists mainly for `/link/*`, the deep-link namespace every push notification points at
  (`HOSTING_DEEP_LINK_ORIGIN` in the app). Those paths have no page of their own and never need one:
  with the app installed, iOS and Android intercept the URL via `.well-known/apple-app-site-association`
  and `.well-known/assetlinks.json` before the request reaches this site.

  This is the other case — the link opened without the app, or on a desktop, or by someone it was
  forwarded to. Previously that returned a bare GitHub 404, which reads as a broken notification
  rather than as "you need the app". Absolute paths throughout, because this page is served from
  arbitrary URL depths.
-->
<body data-page="notfound">
  <nav class="nav">
    <a href="https://gastrack.eu/" class="nav-logo">GasTrack</a>
    <div class="nav-links">
      <a href="https://gastrack.eu/" class="nav-link" data-i18n="nav_home">Home</a>
      <a href="https://gastrack.eu/privacy.html" class="nav-link" data-i18n="nav_privacy">Privacy</a>
      <a href="https://gastrack.eu/terms.html" class="nav-link" data-i18n="nav_terms">Terms</a>
      <div class="lang-switcher">
        <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button type="button" class="lang-btn" data-lang="it" onclick="setLang('it')">IT</button>
        <button type="button" class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
      </div>
    </div>
  </nav>

  <main>
    <section class="hero container">
      <div class="badge fade-in delay-1" id="nf-badge" hidden>
        <span aria-hidden="true">🔗</span> <span data-i18n="nf_badge">GasTrack link</span>
      </div>

      <h1 class="display fade-in delay-1">
        <span id="nf-title" data-i18n="nf_title_generic">Page not found</span>
      </h1>

      <p class="sub fade-in delay-3" id="nf-sub" data-i18n="nf_sub_generic">
        That page doesn’t exist. The links below will get you where you’re going.
      </p>

      <div class="btn-row fade-in delay-4">
        <a class="btn btn-primary" href="https://gastrack.eu/beta-access.html" data-i18n="nf_cta_beta">Request beta access</a>
        <a class="btn btn-secondary" href="https://gastrack.eu/" data-i18n="nav_home">Home</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-logo">GasTrack · gastrack.eu</div>
    <div class="footer-links">
      <a href="https://gastrack.eu/" class="footer-link" data-i18n="nav_home">Home</a>
      <a href="https://gastrack.eu/privacy.html" class="footer-link" data-i18n="nav_privacy">Privacy</a>
      <a href="https://gastrack.eu/terms.html" class="footer-link" data-i18n="nav_terms">Terms</a>
      <a href="https://gastrack.eu/beta-access.html" class="footer-link" data-i18n="footer_beta_access">Beta access</a>
      <a href="mailto:support.gastrack@gmail.com" class="footer-link">support.gastrack@gmail.com</a>
    </div>
    <p class="footer-copy" data-i18n="footer_copy">© 2025–2026 GasTrack. All rights reserved.</p>
  </footer>

  <script>
    /*
     * Swap the copy for deep links before i18n runs, so `setLang` renders whichever variant applies.
     *
     * Deliberately no redirect and no custom-scheme probe. If the app is installed the OS has
     * already handled the URL and this page was never reached; firing a scheme from here would only
     * show an error dialog to the people who do not have it — which is everyone who sees this page.
     */
    (function () {
      if (!location.pathname.startsWith('/link/')) return;
      document.getElementById('nf-badge').hidden = false;
      document.getElementById('nf-title').setAttribute('data-i18n', 'nf_title_link');
      document.getElementById('nf-sub').setAttribute('data-i18n', 'nf_sub_link');
      document.title = 'GasTrack — Open in the app';
    })();
  </script>
  <script src="/js/legal-translations.js"></script>
  <script src="/js/i18n.js"></script>
</body>
</html>
