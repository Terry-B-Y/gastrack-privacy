<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GasTrack — Privacy Policy</title>
  <meta name="description" content="Privacy policy for the GasTrack mobile app." />
  <meta name="author" content="Terry Boakye Yiadom" />
  <meta name="copyright" content="© 2025–2026 GasTrack. All rights reserved." />
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <!-- PWA / social sharing -->
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#F5A623">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&amp;family=DM+Sans:wght@300;400;500;600&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="privacy">
  <nav class="nav">
    <a href="https://gastrack.eu/" class="nav-logo">GasTrack</a>
    <div class="nav-links">
      <a href="https://gastrack.eu/" class="nav-link" data-i18n="nav_home">Home</a>
      <a href="https://gastrack.eu/privacy.html" class="nav-link active" data-i18n="nav_privacy">Privacy</a>
      <a href="https://gastrack.eu/terms.html" class="nav-link" data-i18n="nav_terms">Terms</a>
      <div class="lang-switcher">
        <button type="button" class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button type="button" class="lang-btn" data-lang="it" onclick="setLang('it')">IT</button>
        <button type="button" class="lang-btn" data-lang="fr" onclick="setLang('fr')">FR</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="section section--tight">
      <span class="label" data-i18n="privacy_updated">Last updated: 5 April 2026</span>
      <h1 data-i18n="privacy_title">GasTrack — Privacy Policy</h1>
      <p class="sub" data-i18n="privacy_intro" data-i18n-html="true"></p>
    </section>

    <section class="section" style="padding-top: 0;">
      <div class="card legal" data-i18n="privacy_body_html" data-i18n-html="true"></div>

      <div class="card contact-card fade-in" style="margin-top: 20px; text-align: center;">
        <h2 style="border: none; margin-top: 0; padding: 0;" data-i18n="privacy_contact_heading">Contact</h2>
        <p style="margin-bottom: 16px;" data-i18n="privacy_contact_line_html" data-i18n-html="true">
          Email: <a href="mailto:support.gastrack@gmail.com">support.gastrack@gmail.com</a>
        </p>
        <a class="btn btn-primary" href="mailto:support.gastrack@gmail.com">support.gastrack@gmail.com</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-logo">GasTrack · gastrack.eu</div>
    <div class="footer-links">
      <a href="https://gastrack.eu/" class="footer-link" data-i18n="nav_home">Home</a>
      <a href="https://gastrack.eu/privacy.html" class="footer-link" data-i18n="nav_privacy">Privacy</a>
      <a href="https://gastrack.eu/terms.html" class="footer-link" data-i18n="nav_terms">Terms</a>
      <a href="https://gastrack.eu/delete-account.html" class="footer-link" data-i18n="footer_delete_account" style="color: var(--text-tertiary);">Delete account</a>
      <a href="mailto:support.gastrack@gmail.com" class="footer-link">support.gastrack@gmail.com</a>
    </div>
    <p class="footer-copy" data-i18n="footer_copy">© 2025–2026 GasTrack. All rights reserved.</p>
  </footer>
  <script src="js/legal-translations.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
